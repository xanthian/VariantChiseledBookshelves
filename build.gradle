plugins {
    id 'fabric-loom' version '1.12.5'
    id 'maven-publish'
}

// Loom also supplies project repositories. Prepend the mirror so Central dependencies use it first.
def centralMirror = repositories.maven {
    name = 'MavenCentralMirror'
    url = 'https://maven-central.storage-download.googleapis.com/maven2/'
    content {
        excludeGroupByRegex 'net\\.fabricmc(\\..*)?'
        excludeGroup 'com.mojang'
    }
}
repositories.remove(centralMirror)
repositories.addFirst(centralMirror)

version = project.mod_version
group = project.maven_group

loom {
    mixin.useLegacyMixinAp = true
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

base {
    archivesName = project.archives_base_name
}

processResources {
    inputs.property "version", project.version

    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }

    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}

loom {
    mods {
        variantchiseledbookshelves { sourceSet sourceSets.main }
        shelf_tests { sourceSet sourceSets.test }
    }
    runs {
        gametest {
            server()
            source sourceSets.test
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dshelf.assetJar=${gradle.gradleUserHomeDir}/caches/fabric-loom/${project.minecraft_version}/minecraft-client.jar"
        }
    }
}
tasks.named('test', Test) { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn 'runGametest' }
