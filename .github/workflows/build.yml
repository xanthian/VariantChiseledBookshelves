name: build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - minecraft: '1.21'
            mappings: '1.21+build.9'
            api: '0.102.0+1.21'
          - minecraft: '1.21.1'
            mappings: '1.21.1+build.3'
            api: '0.110.0+1.21.1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@v5
      - run: chmod +x gradlew
      - run: ./gradlew build -Pminecraft_version=${{ matrix.minecraft }} -Pyarn_mappings=${{ matrix.mappings }} -Pfabric_version=${{ matrix.api }}
      # The 1.21 jar supports both game versions. Both matrix entries still run all tests.
      - uses: actions/upload-artifact@v6
        if: matrix.minecraft == '1.21'
        with:
          name: variantchiseledbookshelves
          if-no-files-found: error
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
